<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 자가업무진단 플랫폼</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-logo">
            <span class="univ-name">동원과학기술대학교</span>
        </div>
        <div class="header-title">
            <p>자가분석을 통한 자기개발과 업무효율 극대화</p>
            <h1>AI자가업무진단플랫폼</h1>
        </div>
        <div class="header-desc">
            본 진단은 자가분석을 통한 자기개발 및 조직의<br>
            효율적 운영을 위한 데이터로 활용할 자료입니다.<br>
            가감없이 진단해 주시기 바랍니다.
        </div>
        
        <div class="user-info-panel">
            <div class="user-field">
                <label>소속</label>
                <input type="text" id="user-dept">
            </div>
            <div class="user-field">
                <label>직위</label>
                <input type="text" id="user-position">
            </div>
            <div class="user-field">
                <label>성명</label>
                <input type="text" id="user-name">
            </div>
            <div class="user-field">
                <label>성별</label>
                <select id="user-gender">
                    <option value="남">남</option>
                    <option value="여">여</option>
                </select>
            </div>
            <div class="user-field">
                <label>근무년수</label>
                <input type="number" id="user-years" min="0">
            </div>
            <div class="user-field">
                <label>해당년도</label>
                <input type="number" id="user-year" value="2026">
            </div>
            <button id="main-complete-btn" class="btn-complete">완료</button>
        </div>
    </header>

    <main class="dashboard-grid">
        <div class="tasks-wrapper">
            <div class="tasks-scroll-container" id="tasks-container">
            </div>
            <button id="add-task-btn" class="btn-add-task">+ 진단업무 추가</button>
        </div>

        <aside class="summary-panel">
            <div class="summary-section purple-theme">
                <div class="section-header">종합진단결과 (자동입력)</div>
                <div class="summary-content">
                    <div class="sum-row">
                        <span>년간업무소요시간</span>
                        <div class="sum-val"><span id="sum-total-hours">0</span>h</div>
                    </div>
                    <div class="sum-row">
                        <span>년간 업무일수</span>
                        <div class="sum-val input-val"><input type="number" id="annual-work-days" value="210">일</div>
                    </div>
                    <div class="sum-row">
                        <span>1일 평균근무시간</span>
                        <div class="sum-val"><span id="sum-daily-hours">0.0</span>h</div>
                    </div>
                    <div class="sum-row">
                        <span>년간업무수</span>
                        <div class="sum-val"><span id="sum-total-tasks">0</span>개</div>
                    </div>
                </div>
                <button id="export-excel-btn" class="btn-complete blue">완료 (엑셀다운)</button>
            </div>

            <div class="summary-section yellow-theme">
                <div class="section-header">타임요소별 년간 투자시간</div>
                <div class="summary-content time-elements-summary" id="time-summary-container">
                </div>
                <div class="nav-buttons">
                    <button id="reset-btn" class="btn-nav">초기화(처음)</button>
                </div>
            </div>
        </aside>
    </main>

    <template id="task-template">
        <div class="task-card">
            <div class="task-header green-theme">
                <div class="task-title-bar">
                    <span class="task-label">진단업무</span>
                    <span class="task-index">1</span>
                </div>
                <button class="delete-btn">✕</button>
            </div>
            <div class="task-body">
                <div class="task-field">
                    <label>업무명</label>
                    <input type="text" class="task-name" placeholder="예: 교육프로그램 운영">
                </div>
                <div class="task-field">
                    <label>업무주체</label>
                    <select class="task-role">
                        <option value="주관">주관</option>
                        <option value="보조">보조</option>
                        <option value="주관/보조">주관/보조</option>
                    </select>
                </div>
                <div class="task-field">
                    <label>업무형태</label>
                    <select class="task-type">
                        <option value="신규">신규</option>
                        <option value="반복">반복</option>
                        <option value="신규/반복">신규/반복</option>
                    </select>
                </div>
                <div class="task-field">
                    <label>해당업무년수</label>
                    <select class="task-years">
                        <option value="1년">1년</option>
                        <option value="2년">2년</option>
                        <option value="3년이상">3년이상</option>
                        <option value="1년/2년/3년이상">1년/2년/3년이상</option>
                    </select>
                </div>
                <div class="task-field highlight-field">
                    <label>건당소요시간</label>
                    <div class="val-box"><span class="task-duration">0</span>H(아래 시간 자동합산)</div>
                </div>
                
                <div class="time-elements-box">
                    <div class="time-elements-header">
                        <span class="icon">⏱</span> 타임요소
                    </div>
                    <div class="time-elements-list">
                    </div>
                </div>

                <div class="task-field highlight-green">
                    <label>년간해당업무건수</label>
                    <div class="input-with-label">
                        <input type="number" class="task-annual-count" value="1" min="1" max="1000">건
                    </div>
                </div>
                <div class="task-field highlight-green">
                    <label>년간업무시간</label>
                    <div class="val-box"><span class="task-annual-hours">0</span>H</div>
                </div>
                <button class="btn-complete orange task-complete">완료 (다음 업무 추가)</button>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
